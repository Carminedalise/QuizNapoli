<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Napoli Quiz - Era Post-Scudetto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="quiz-container" id="quiz-box">
    <img src="assets/logo napoli.png" alt="Logo SSC Napoli" class="logo">
    
    <h1>Napoli Quiz 2023-2025</h1>
    
    <div id="game-section">
        <div class="question" id="question-text">Caricamento...</div>
        <div class="options" id="options-container"></div>
        <button id="next-btn">Prossima Domanda</button>
    </div>

    <div id="result-section" class="hidden">
        <h2>Risultato Finale</h2>
        <p id="final-score"></p>
        <button id="restart-btn">Ricomincia</button>
    </div>
</div>

    <script src="script.js"></script>
</body>
</html>
